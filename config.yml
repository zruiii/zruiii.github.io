description: "Ray 的个人博客，分享 AI 算法学习心得与工程实践"
homepage: 'https://zruiii.github.io'
defaultContentLanguage: 'zh'
paginate: 10
params:
  brand: HOME
  avatarURL: /images/avatar.png
  author: 👋 Welcome to Ray’Log
  authorDescription: "An AI engineer sharing notes on AI algorithms and engineering practice."
  info: "Hi, I'm Ray — an AI algorithm engineer who loves building products. Here I share my notes on AI/ML and my journey building AI-native apps."
  favicon: /images/avatar.png
  options:
    showDarkMode: true
    enableImgZooming: false
    enableMultiLang: true
  darkModeTheme: data-dark-mode
  #darkModeTheme: icy-dark-mode
  comments:
    giscus:
      enable: true
      repo: zruiii/zruiii.github.io
      repo_id: R_kgDOMcIcvQ
      category: Announcements
      category_id: DIC_kwDOMcIcvc4DAFOn
      mapping: pathname
      position: top
      lang: zh-CN # pick a language from https://github.com/giscus/giscus/tree/main/locales
    utteranc:
      enable: false
      repo: username/xxx
      issueTerm: pathname
  analytics:
    google:
      SiteVerificationTag: xxx
    umami:
      enable: true
      website_id: f5034a22-a895-444b-9be2-5a9cc40472ac
      url: https://cloud.umami.is/script.js
  guestbook:
    title: Guestbook
    description: "Say hi — let's be friends."
  social:
